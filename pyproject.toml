[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scqpas"
version = "0.1.0"
description = "Single-cell quantification of polyadenylation sites"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Zavolan Lab", email = "contact@example.com"},
]
keywords = [
    "bioinformatics",
    "polyadenylation",
    "single-cell",
    "RNA-seq",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
    "sphinx>=5.0",
]

[project.urls]
"Homepage" = "https://github.com/sglnat/scQPAS"
"Bug Tracker" = "https://github.com/sglnat/scQPAS/issues"
"Documentation" = "https://github.com/sglnat/scQPAS"
"Source Code" = "https://github.com/sglnat/scQPAS"

[project.scripts]
scqpas = "scqpas.cli:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true